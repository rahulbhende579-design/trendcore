<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" fill="none">
  <defs>
    <linearGradient id="tcGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Logo Icon Container -->
  <rect x="4" y="4" width="48" height="48" rx="14" fill="url(#tcGrad)" />
  <rect x="4" y="4" width="48" height="48" rx="14" fill="url(#glowGrad)" />

  <!-- Trend Bars & Upward Arrow -->
  <!-- Bar 1 -->
  <rect x="13" y="32" width="5" height="12" rx="2.5" fill="#FFFFFF" fill-opacity="0.75" />
  <!-- Bar 2 -->
  <rect x="22" y="24" width="5" height="20" rx="2.5" fill="#FFFFFF" fill-opacity="0.9" />
  <!-- Bar 3 -->
  <rect x="31" y="16" width="5" height="28" rx="2.5" fill="#FFFFFF" />

  <!-- Dynamic Upward Trend Line & Arrowhead -->
  <path d="M 12 36 L 22 26 L 31 19 L 41 12" stroke="#A5F3FC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 35 12 L 41 12 L 41 18" stroke="#A5F3FC" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Brand Text -->
  <text x="62" y="31" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="24" font-weight="800" fill="currentColor" letter-spacing="-0.5px">Trend<tspan fill="#06B6D4">Core</tspan></text>
  <!-- Tagline -->
  <text x="63" y="45" font-family="'Inter', -apple-system, sans-serif" font-size="9" font-weight="600" fill="currentColor" opacity="0.65" letter-spacing="1.5px">TRADE • LEARN • GROW</text>
</svg>
